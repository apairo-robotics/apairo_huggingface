[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apairo-huggingface"
version = "0.1.0"
description = "Label apairo robotics datasets and export them to HuggingFace LeRobotDataset format."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apairo>=0.9",
    "apairo_preprocess",
    "apairo_transform",
    "lerobot>=0.4.0",
    "datasets>=4.0",
    "numpy",
    "Pillow",
    "scipy",
    "kiss-icp>=1.2",
]

[project.optional-dependencies]
test = ["pytest"]
sim = ["rosbags>=0.11"]       # apairo-sim-amiad extract only (mcap reader)

[project.scripts]
apairo-tartan-label = "apairo_huggingface.cli:label_main"
apairo-tartan-export = "apairo_huggingface.cli:main"
apairo-tartan-gt-label = "apairo_huggingface.cli:gt_label_main"
apairo-tartan-gt-export = "apairo_huggingface.cli:gt_export_main"
apairo-fomo = "apairo_huggingface.fomo.cli:main"
apairo-rellis = "apairo_huggingface.rellis.cli:main"
apairo-sim-amiad = "apairo_huggingface.sim_amiad.cli:main"
apairo-tartan-bev = "apairo_huggingface.tartan_bev.cli:main"

[project.entry-points."apairo.formats"]
fomo_bin = "apairo_huggingface.fomo.format:FomoBinFormat"
semkitti_label = "apairo_huggingface.rellis.format:SemKittiLabelFormat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apairo_huggingface.fomo" = ["apairo.yaml"]
"apairo_huggingface.rellis" = ["apairo.yaml", "apairo_bev.yaml"]
"apairo_huggingface.tartan_bev" = ["apairo_bev.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
