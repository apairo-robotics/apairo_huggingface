[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apairo-huggingface"
version = "0.1.0"
description = "Label apairo robotics datasets and export them to HuggingFace LeRobotDataset format."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apairo>=0.6",
    "apairo_preprocess",
    "apairo_transform",
    "lerobot>=0.4.0",
    "datasets>=4.0",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
apairo-tartan-label = "apairo_huggingface.cli:label_main"
apairo-tartan-export = "apairo_huggingface.cli:main"
apairo-tartan-gt-label = "apairo_huggingface.cli:gt_label_main"
apairo-tartan-gt-export = "apairo_huggingface.cli:gt_export_main"

[project.entry-points."apairo.formats"]
fomo_bin = "apairo_huggingface.fomo.format:FomoBinFormat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
