[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apairo-huggingface"
version = "0.1.0"
description = "Export apairo robotics datasets to HuggingFace LeRobotDataset format."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apairo",
    "apairo_transform",
    "lerobot>=0.4.0",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
apairo-tartan-export = "apairo_huggingface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
